"""Cart redirect URLs."""
type CartRedirectUrls {
  """
  The single-use URL to the BigCommerce hosted checkout for the cart. Should be generated just-in-time (within 30s).
  """
  redirectedCheckoutUrl: String!

  """
  The single-use URL to the embedded checkout for the cart. Should be generated just-in-time (within 30s).
  """
  embeddedCheckoutUrl: String!

  """
  The single-use URL to the external checkout for the cart. Should be generated just-in-time (within 30s). Not usable when externalCheckoutHandoff.method is POST, because the token does not fit in a URL for every payment method - use externalCheckoutHandoff instead.
  """
  externalCheckoutUrl: String!

  """
  How to hand the shopper to the external checkout. Prefer this over externalCheckoutUrl: it describes the transport as well as the destination, so it keeps working for payment methods whose payload cannot travel in a URL. Only the external checkout has one, because the hosted and embedded checkouts accept GET only and so always take the plain redirect.
  """
  externalCheckoutHandoff: CheckoutHandoff!
}

